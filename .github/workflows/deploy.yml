name: Deploy

# ── Trigger: every push (merge) to main ─────────────────────────────────────
on:
  push:
    branches: [main]

jobs:

  # ── Step 1: Deploy to staging ──────────────────────────────────────────────
  deploy-staging:
    name: Deploy → staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Deploy to staging
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_STAGING_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_STAGING_TOKEN }}
        run: databricks bundle deploy -t staging --auto-approve

  # ── Step 2: Deploy to prod (requires staging to succeed + manual approval) ─
  deploy-prod:
    name: Deploy → prod
    runs-on: ubuntu-latest
    needs: deploy-staging         # only runs if deploy-staging succeeds

    # "production" is a GitHub Environment with required reviewers configured.
    # To manage reviewers: repo Settings → Environments → production → Deployment protection rules
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Deploy to prod
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_PROD_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_PROD_TOKEN }}
        run: databricks bundle deploy -t prod --auto-approve
