# ============================================================================
# Pop Mart — Databricks Asset Bundle (DAB) CI/CD Demo
#
# Stack:
#   • Lakeflow Declarative Pipeline (DLT): Bronze → Silver → Gold
#   • Lakeflow Job: orchestrates pipeline + post-run report notebook
#   • GitHub Actions CI/CD: PR validation → deploy staging → deploy prod
#
# Targets:
#   dev      — mode: development  (LOCAL only — names auto-prefixed, schedules paused)
#   staging  — shared CI environment, [staging] prefix, same schema as dev
#   prod     — mode: production   (no prefix, strict validation, approval gate)
#
# Quick start (local):
#   databricks bundle validate             # validates against dev (default)
#   databricks bundle deploy               # deploy your personal dev copy
#   databricks bundle deploy -t staging    # deploy to shared staging
#   databricks bundle deploy -t prod       # promote to prod
# ============================================================================
bundle:
  name: popmart_medallion

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog where Silver & Gold tables are published.
    default: popmart
  schema:
    description: Schema where Silver & Gold tables are published.
    default: popmart_medallion
  source_catalog:
    description: Catalog holding the Bronze source tables (ingested by Lakeflow Connect).
    default: popmart
  source_schema:
    description: Schema holding the Bronze source tables.
    default: default
  notification_email:
    description: Email address for job failure alerts.
    default: data-platform@popmart.com

targets:

  # ── LOCAL dev sandbox — never deployed by CI/CD ───────────────────────────
  dev:
    mode: development   # resource names auto-prefixed: [dev <your-username>]
    default: true       # used when no -t flag is passed locally
    workspace:
      host: https://dbc-2e43b02f-eefb.cloud.databricks.com
    variables:
      schema: popmart_medallion_dev

  # ── Staging — shared CI environment, deployed automatically on merge ───────
  staging:
    workspace:
      host: https://dbc-2e43b02f-eefb.cloud.databricks.com
      root_path: /Workspace/Users/darren.wee@databricks.com/.bundle/${bundle.name}/staging
    presets:
      name_prefix: "[staging] "   # keeps staging resources distinct from prod in same workspace
      jobs_max_concurrent_runs: 1
    variables:
      catalog: popmart
      schema: popmart_medallion
      source_catalog: popmart
      source_schema: default

  # ── Production — no prefix, strict validation, approval gate required ──────
  prod:
    mode: production
    workspace:
      host: https://dbc-2e43b02f-eefb.cloud.databricks.com
      root_path: /Workspace/Users/darren.wee@databricks.com/.bundle/${bundle.name}/${bundle.target}
    # Uncomment once your service principal is set up:
    # run_as:
    #   service_principal_name: popmart-prod-sp
    variables:
      catalog: popmart-prod
      schema: popmart_medallion
      source_catalog: popmart
      source_schema: default
